name: Android Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Keystore base64 y passwords vienen de Github Secrets
      RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Por defecto instala tools y platform-tools
          packages: ''

      - name: Install API 34 & Build Tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: List debug output
        run: find app/build/outputs -type f | sort || true

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        run: printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        run: ./gradlew :app:assembleRelease
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks

      - name: List release output
        if: github.event_name != 'pull_request'
        run: find app/build/outputs -type f | sort || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flingerbit-debug-apk
          path: app/build/outputs/**/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: flingerbit-release-apk
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
